name: Tests

on:
  push:
  pull_request:
    types: [opened, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        django-version:
        - '52'
        - '60'
        - '61'
        exclude:
          # Django 6.0+ requires python 3.12+
          - python-version: '3.10'
            django-version: '60'
          - python-version: '3.10'
            django-version: '61'
          - python-version: '3.11'
            django-version: '60'
          - python-version: '3.11'
            django-version: '61'
          # Django 5.2 doesn't support python 3.14
          - python-version: '3.14'
            django-version: '52'
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      DJANGO_VERSION: ${{ matrix.django-version }}
      PYTHONUNBUFFERED: 1

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        make native-install-all
        python -m pip install tox

    - name: Test with tox
      run: |
        echo "Running py${PYTHON_VERSION/\./}-django${DJANGO_VERSION}" 
        tox -e "py${PYTHON_VERSION/\./}-django${DJANGO_VERSION}"

    - name: Coveralls Parallel
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.python-version }}-${{ matrix.django-version }}
        parallel: true
        path-to-lcov: "coverage.lcov"

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
        path-to-lcov: "coverage.lcov"
