[tox]
envlist=
    py{310}-django{52}
    py{311}-django{52}
    py{312}-django{52, 60, 61}
    py{313}-django{52, 60, 61}
    py{314}-django{60, 61}

[testenv]
setenv =
    PYTHONPATH = {toxinidir}/example_project
    LC_ALL = en_US.utf-8
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    djangorestframework<4.0
    social-auth-core==5.0.0
    social-auth-app-django==6.0.0
    djangorestframework_simplejwt
    django-rest-knox>=5.1.0,<6.0.0
    coverage
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    -rrequirements_test.txt
commands =
    coverage run --source=rest_social_auth -m pytest {posargs}
    coverage report
    coverage lcov
